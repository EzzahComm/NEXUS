$kind: http-request
name: Stream All Events
method: GET
url: '{{baseUrl}}/api/events/stream'
description: |-
  Server-Sent Events (SSE) stream for all tenant events.
  Response Content-Type is text/event-stream. Keep connection open.
  Heartbeat comment sent every 25 seconds to maintain the connection.
  Use an SSE-capable client or browser EventSource API to consume this stream.
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: x-tenant-id
    value: '{{tenantId}}'
  - key: Accept
    value: text/event-stream
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Content-Type includes text/event-stream", function () {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("text/event-stream");
      });
