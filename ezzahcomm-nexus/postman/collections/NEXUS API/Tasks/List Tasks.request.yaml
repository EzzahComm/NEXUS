$kind: http-request
name: List Tasks
method: GET
url: '{{baseUrl}}/api/tasks?status=pending&priority=5&limit=20&offset=0'
description: |-
  List tasks for the current tenant with optional filters for status, priority, pagination.
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: x-tenant-id
    value: '{{tenantId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has 'tasks' array", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("tasks");
        pm.expect(json.tasks).to.be.an("array");
      });
