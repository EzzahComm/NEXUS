$kind: http-request
name: Get Task
method: GET
url: '{{baseUrl}}/api/tasks/{{taskId}}'
description: |-
  Retrieve details of a specific task by its UUID.
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: x-tenant-id
    value: '{{tenantId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 404", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      pm.test("Response is valid JSON", function () {
        pm.response.to.be.json;
      });
