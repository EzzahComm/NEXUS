$kind: http-request
name: Get Usage Stats
method: GET
url: '{{baseUrl}}/api/tenants/me/stats'
description: |-
  Retrieve usage statistics for the current tenant including task counts, SMS usage, and more.
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: x-tenant-id
    value: '{{tenantId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has 'tasks' and 'sms' fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("tasks");
        pm.expect(json).to.have.property("sms");
      });
