$kind: http-request
name: Get My Profile
method: GET
url: '{{baseUrl}}/api/tenants/me'
description: |-
  Retrieve the profile and settings of the currently authenticated tenant.
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: x-tenant-id
    value: '{{tenantId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has 'id' and 'name'", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("name");
      });
