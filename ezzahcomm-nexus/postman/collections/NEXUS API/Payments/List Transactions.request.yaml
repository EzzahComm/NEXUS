$kind: http-request
name: List Transactions
method: GET
url: '{{baseUrl}}/api/payments/transactions?type=mpesa&limit=20'
description: |-
  List payment transactions for the current tenant. Filter by payment type (mpesa, card) and paginate results.
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: x-tenant-id
    value: '{{tenantId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has 'transactions' array", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("transactions");
        pm.expect(json.transactions).to.be.an("array");
      });
