$kind: http-request
name: List Agents
method: GET
url: '{{baseUrl}}/api/agents'
description: |-
  Retrieve a list of all agents registered under the current tenant.
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: x-tenant-id
    value: '{{tenantId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has 'agents' array", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("agents");
        pm.expect(json.agents).to.be.an("array");
      });
