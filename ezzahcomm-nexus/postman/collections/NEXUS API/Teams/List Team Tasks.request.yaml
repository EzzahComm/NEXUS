$kind: http-request
name: List Team Tasks
method: GET
url: '{{baseUrl}}/api/teams/{{teamId}}/tasks?state=running'
description: |-
  List all tasks assigned to a specific team, optionally filtered by state.
order: 9000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: x-tenant-id
    value: '{{tenantId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has 'tasks' array", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("tasks");
        pm.expect(json.tasks).to.be.an("array");
      });
