$kind: http-request
name: Get Team
method: GET
url: '{{baseUrl}}/api/teams/{{teamId}}'
description: |-
  Retrieve full details of a specific team including its agents and tasks.
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: x-tenant-id
    value: '{{tenantId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 404", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      pm.test("If 200, response has 'id' and 'tasks'", function () {
        if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("tasks");
        }
      });
