$kind: http-request
name: List Teams
method: GET
url: '{{baseUrl}}/api/teams?status=active'
description: |-
  List all teams for the current tenant, optionally filtered by status.
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: x-tenant-id
    value: '{{tenantId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has 'teams' array", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("teams");
        pm.expect(json.teams).to.be.an("array");
      });
