$kind: http-request
name: List Active Sessions
method: GET
url: '{{baseUrl}}/api/teams/sessions'
description: |-
  Retrieve all currently active team sessions for the tenant.
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: x-tenant-id
    value: '{{tenantId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has 'sessions' array", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("sessions");
        pm.expect(json.sessions).to.be.an("array");
      });
